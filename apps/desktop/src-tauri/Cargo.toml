[package]
name = "creator-studio"
version = "0.3.0"
description = "稿台 · 创作者的 AI 制片台"
authors = ["Creator Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "creator_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
